{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card">

                <div class="card-header">
                    <h4 class="mb-0">New Message</h4>
                </div>

                <div class="card-body">

                    <form method="post">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit">
                            Save Training
                        </button>

                        </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
